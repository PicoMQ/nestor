# The nestor binary in the bench stack. Mirrors the library target's defaults so the two are
# comparable: 1 MiB blocks, immutable objects, no readahead, hedging on.

[server]
listen = "0.0.0.0:9000"
metrics = "0.0.0.0:9100"

[origin]
endpoint = "http://host.docker.internal:19300"
region = "us-east-1"
credentials = { source = "static", access_key = "nestor", secret_key = "nestornestor" }

[auth]
mode = "static"
access_key = "nestor"
secret_key = "nestornestor"

[cache]
memory = "1 GiB"

[cache.disk]
path = "/var/lib/nestor"
capacity = "8 GiB"

[buckets]
block_size = "1 MiB"
consistency = { mode = "immutable" }
readahead = 0
