[package]
name = "nestor-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Workload generator and origin proxy for measuring nestor against an S3-compatible origin"
repository.workspace = true
publish = false

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
byte-unit.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
futures.workspace = true
hdrhistogram = "7.6.0"
http.workspace = true
http-body-util.workspace = true
humantime = "2.4.0"
humantime-serde.workspace = true
hyper = { workspace = true, features = ["server", "client", "http1"] }
hyper-util = { workspace = true, features = ["server", "client", "client-legacy", "http1", "tokio"] }
memory-stats = "1.2.0"
metrics-exporter-prometheus.workspace = true
nestor = { workspace = true, features = ["serde"] }
nestor-e2e = { version = "0.1.0", path = "../nestor-e2e" }
nestor-store.workspace = true
object_store = { workspace = true, features = ["aws"] }
reqwest.workspace = true
serde.workspace = true
serde_json = "1.0.151"
tokio = { workspace = true, features = ["process", "fs", "net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
