[package]
name = "nestor-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The nestor binary: an S3-compatible read-through cache in front of any S3 origin"
repository.workspace = true

[[bin]]
name = "nestor"
path = "src/main.rs"

[dependencies]
nestor = { workspace = true, features = ["serde"] }
nestor-s3 = { workspace = true }
nestor-server = { workspace = true }
nestor-client = { workspace = true }

byte-unit = { workspace = true }
clap = { workspace = true }
eyre = { workspace = true }
figment = { workspace = true }
humantime-serde = { workspace = true }
http = { workspace = true }
mimalloc = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal", "net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nestor-store.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
