# The nestor binary on the bench instance. Same shape as nestor-bench/nestor.toml so the endpoint and
# library targets stay comparable: 1 MiB blocks, immutable objects, no readahead, hedging on. The
# origin endpoint and region come from /etc/nestor/env, credentials from the instance role.

[server]
listen = "127.0.0.1:19302"
metrics = "127.0.0.1:19303"

[origin]
credentials = { source = "default" }

[auth]
mode = "static"
access_key = "nestor"
secret_key = "nestornestor"

[cache]
memory = "1 GiB"

[cache.disk]
path = "/mnt/nvme/nestor"
capacity = "8 GiB"

[buckets]
block_size = "1 MiB"
consistency = { mode = "immutable" }
readahead = 0
