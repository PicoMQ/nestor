# Three nestor nodes behind the DNS name `nodes`, and a gateway that routes reads across them.
# From the repository root: docker build -t nestor-e2e:local . && docker compose -f nestor-e2e/cluster/compose.yml up
#
# S3 through the gateway: http://localhost:19001, gateway metrics http://localhost:19100
# Node metrics: http://localhost:19101, 19102, 19103
# RustFS directly:        http://localhost:19000

x-node: &node
  image: ${NESTOR_IMAGE:-nestor-e2e:local}
  environment:
    RUST_LOG: ${RUST_LOG:-info}
  volumes:
    - ./node.toml:/etc/nestor/nestor.toml:ro
  networks:
    default:
      aliases:
        - nodes
  depends_on:
    createbucket:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/-/health || exit 1"]
    interval: 2s
    timeout: 5s
    retries: 30

name: nestor-e2e-cluster

services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: nestor
      RUSTFS_SECRET_KEY: nestornestor
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  createbucket:
    image: amazon/aws-cli:2.36.28
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: nestor
      AWS_SECRET_ACCESS_KEY: nestornestor
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://rustfs:9000 s3 mb s3://nestor 2>/dev/null || true
    restart: "no"

  node1:
    <<: *node
    ports:
      - "19101:9100"

  node2:
    <<: *node
    ports:
      - "19102:9100"

  node3:
    <<: *node
    ports:
      - "19103:9100"

  gateway:
    image: ${NESTOR_IMAGE:-nestor-e2e:local}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./gateway.toml:/etc/nestor/nestor.toml:ro
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
    ports:
      - "19001:9000"
      - "19100:9100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/-/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
