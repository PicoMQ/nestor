# One nestor in front of RustFS.
# From the repository root: docker build -t nestor-e2e:local . && docker compose -f nestor-e2e/single/compose.yml up
#
# S3 through nestor: http://localhost:19001, metrics http://localhost:19100
# RustFS directly:    http://localhost:19000

name: nestor-e2e-single

services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: nestor
      RUSTFS_SECRET_KEY: nestornestor
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  createbucket:
    image: amazon/aws-cli:2.36.28
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: nestor
      AWS_SECRET_ACCESS_KEY: nestornestor
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://rustfs:9000 s3 mb s3://nestor 2>/dev/null || true
    restart: "no"

  nestor:
    image: ${NESTOR_IMAGE:-nestor-e2e:local}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./nestor.toml:/etc/nestor/nestor.toml:ro
      - nestor-disk:/var/lib/nestor
    depends_on:
      createbucket:
        condition: service_completed_successfully
    ports:
      - "19001:9000"
      - "19100:9100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/-/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  nestor-disk:
